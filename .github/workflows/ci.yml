# Integração contínua: a cada push e pull request, o projeto precisa compilar
# e os testes da API precisam passar contra um PostgreSQL de verdade.
#
# Nada aqui usa segredo do repositório: o banco é efêmero e o JWT_SECRET é
# gerado na hora, só para a execução dos testes.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API — tipos e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: livrin_test
          POSTGRES_USER: livrin_test
          POSTGRES_PASSWORD: livrin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livrin_test -d livrin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Conferir tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      - name: Rodar os testes
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://livrin_test:livrin_test@localhost:5432/livrin_test

  web:
    name: Front-end — tipos e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar (inclui a checagem de tipos)
        run: npm run build

  interface:
    name: Interface — contraste dos temas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Os temas prometem AAA (7:1) para texto e 3:1 para limite de componente.
      # Promessa que ninguém mede é promessa que envelhece: basta alguém ajustar
      # um token "só um tom" para um par cair sem que nada quebre na tela.
      # São 39 pares por tema, e o script reprova se algum ficar abaixo.
      - name: Medir o contraste dos sete temas
        run: python3 ferramentas/conferir-contraste.py

      # Sem `node_modules` no ambiente onde este projeto é desenvolvido, uma
      # <div> aberta e não fechada só aparecia aqui, dois minutos depois do
      # commit. Este passo responde a mesma pergunta em menos de um segundo —
      # e continua valendo aqui, como rede, para quem abrir PR de outra
      # máquina. Não substitui o compilador, que roda logo acima.
      - name: Conferir o balanceamento das tags JSX
        run: python3 ferramentas/conferir-jsx.py

      # A 3.6.2 quebrou o layout com CSS válido: uma classe nossa declarou
      # `position: relative` e venceu as utilitárias `sticky`/`fixed` do
      # Tailwind por empate de especificidade (0-1-0) e ordem no arquivo.
      # Nem o tsc, nem o build, nem o contraste viam isso. Este passo vê.
      - name: Conferir o posicionamento do cabeçalho e da lateral
        run: python3 ferramentas/conferir-posicionamento.py

      # Informativo: mede quanto da interface ainda não passa pelo dicionário.
      # Não reprova — a cobertura é parcial e declarada como tal.
      - name: Medir a cobertura de tradução
        run: python3 ferramentas/conferir-traducao.py

  docker:
    name: Docker — as imagens constroem
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem da API
        run: docker build --target runtime ./api

      - name: Construir a imagem do front-end
        run: docker build --target runtime ./web
