# =============================================================================
# Banco dedicado aos testes automatizados da API.
#
#     docker compose -f docker-compose.test.yml up -d db-test
#     cd api && TEST_DATABASE_URL=postgres://livrin_test:livrin_test@localhost:5433/livrin_test npm test
#     docker compose -f docker-compose.test.yml down -v
#
# Antes era preciso montar um PostgreSQL à mão antes de rodar `npm test`, e o
# nome do banco precisa conter "test" porque o schema é APAGADO a cada arquivo
# de teste (ver api/tests/helpers.ts). Este serviço existe para que ninguém
# aponte a suíte para o banco de desenvolvimento por engano.
#
# Não tem volume: os dados morrem com o container, de propósito.
# =============================================================================
name: livrin-test

services:
  db-test:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: livrin_test
      POSTGRES_USER: livrin_test
      # Credencial de DESENVOLVIMENTO, de um banco efêmero sem dados reais.
      POSTGRES_PASSWORD: livrin_test
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livrin_test -d livrin_test"]
      interval: 3s
      timeout: 3s
      retries: 20
