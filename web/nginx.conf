# Nginx do front-end Livrin:
#  - serve o build estático do React (SPA, com fallback para index.html);
#  - encaminha /api e /uploads para o container da API (mesma origem → sem CORS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads de obras (PDF/EPUB/CBZ/áudio) — manter alinhado com MAX_UPLOAD_MB da API.
  client_max_body_size 200m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
  }

  location /uploads/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  # Arquivos com hash no nome podem ficar em cache por muito tempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    # O add_header de um bloco filho ANULA os herdados do servidor: por isso os
    # cabeçalhos de segurança são repetidos aqui. Omitir é perder proteção.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri =404;
  }

  # O index.html NUNCA pode ficar em cache.
  #
  # Ele é o único arquivo que aponta para os bundles com hash no nome. Sem
  # cabeçalho de cache, o navegador aplica heurística própria e guarda esta
  # página por horas; como os arquivos em /assets/ são "immutable" por um ano,
  # o resultado é um navegador que continua rodando a versão antiga do site
  # depois de um deploy — sem erro nenhum, sem pista nenhuma. Foi exatamente
  # o que aconteceu aqui: correções publicadas e invisíveis na tela.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    expires -1;
    # O add_header de um bloco filho ANULA os herdados do servidor: por isso os
    # cabeçalhos de segurança são repetidos aqui. Omitir é perder proteção.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
  }

  location / {
    add_header Cache-Control "no-store, must-revalidate" always;
    expires -1;
    # O add_header de um bloco filho ANULA os herdados do servidor: por isso os
    # cabeçalhos de segurança são repetidos aqui. Omitir é perder proteção.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri $uri/ /index.html;
  }
}
